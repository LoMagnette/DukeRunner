name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '26'

      - name: Set up JBang
        uses: jbangdev/setup-jbang@main
        with:
          setup-java: false

      - name: Build TUI fat jar
        run: |
          mkdir -p artifacts
          jbang export fatjar --force -O artifacts/qaly-runner-tui.jar src/main/java/be/lomagnette/duke/runner/tui/DukeRunner.java

      - name: Set release version
        run: echo "JRELEASER_PROJECT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run JReleaser
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: out/jreleaser/trace.log
          if-no-files-found: ignore
